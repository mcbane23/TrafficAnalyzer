name: CI

# Every branch and PR: install, test, build, and build the Docker image as a
# check - nothing is uploaded, pushed or cached on GitHub.
# Push to main (i.e. a merged PR): same, then the image is pushed to GHCR as
# ghcr.io/mcbane23/trafficanalyzer:latest and :<commit sha>, for linux/amd64
# and linux/arm64 (each built natively on its own runner, no emulation).
# Push of a version tag (v1.3, v2.0.1...): the image is also pushed as
# :<tag>, so a server can stay on a known version instead of :latest. The
# Admin page shows the tag, commit and build time (APP_VERSION, GIT_SHA,
# BUILD_DATE build args).
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref_type != 'tag' }}

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/mcbane23/trafficanalyzer
  # docker/build-push-action uploads a build record as a workflow artifact by
  # default - turn that off so no build keeps artifacts on GitHub.
  DOCKER_BUILD_RECORD_UPLOAD: 'false'
  DOCKER_BUILD_SUMMARY: 'false'

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # No `cache: npm` here on purpose: it would save an Actions cache entry
      # from every branch build.
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - run: npm ci
      - run: npm test
      - run: npm run build

  # One job per architecture on a native runner (QEMU would take an hour for
  # the ffmpeg build). On main each pushes its image by digest only, and the
  # `publish` job below joins the two into the tagged multi-arch image.
  docker:
    name: Docker image (${{ matrix.arch }})
    needs: test
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag') }}
    outputs:
      # Each leg sets only its own output, so both survive the matrix.
      digest-amd64: ${{ steps.digest.outputs.digest-amd64 }}
      digest-arm64: ${{ steps.digest.outputs.digest-arm64 }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build time
        id: date
        run: echo "now=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # Branches only read the layer cache that main builds write, so they
      # don't add cache entries of their own.
      - name: Build (and push by digest on main and tags)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: |
            APP_VERSION=${{ github.ref_type == 'tag' && github.ref_name || '' }}
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.date.outputs.now }}
          provenance: false
          outputs: ${{ env.PUBLISH == 'true' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE_NAME) || 'type=cacheonly' }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: ${{ env.PUBLISH == 'true' && format('type=gha,mode=max,scope={0}', matrix.arch) || '' }}

      - name: Record digest
        id: digest
        if: env.PUBLISH == 'true'
        run: echo "digest-${{ matrix.arch }}=${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish multi-arch image
    needs: docker
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          # :latest only follows main; a tag push adds :<tag> (e.g. :v1.3).
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=sha,format=long,prefix=
          flavor: latest=false

      - name: Tag the amd64 + arm64 image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          AMD64: ${{ needs.docker.outputs.digest-amd64 }}
          ARM64: ${{ needs.docker.outputs.digest-arm64 }}
        run: |
          test -n "$AMD64" && test -n "$ARM64"
          docker buildx imagetools create $(printf -- '-t %s ' $TAGS) "$IMAGE_NAME@$AMD64" "$IMAGE_NAME@$ARM64"
          docker buildx imagetools inspect "$IMAGE_NAME:${{ github.sha }}"
