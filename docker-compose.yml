services:
  trafficanalyzer:
    # `docker compose pull` fetches the published image; `docker compose build`
    # builds it locally from the Dockerfile instead.
    image: ghcr.io/mcbane23/trafficanalyzer:latest
    build: .
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      # Password for the Admin page (cameras, settings). It can also be set on the
      # Admin page itself; this line, when present, wins. Without any password Admin is
      # open to anyone who can reach the port; the dashboard and statistics stay open either way.
      # - ADMIN_PASSWORD=change-me
      # Run the live-view vehicle detector on an Intel GPU (OpenVINO). Needs the
      # `devices` / `group_add` lines below; without them it falls back to the CPU.
      # - OVERLAY_DEVICE=GPU
      # Which cameras are analyzed (none until you switch them on), the frame
      # rates, the GPU YOLO model and the box confidence are set on the Admin
      # page. ANALYSIS_FPS, OVERLAY_FPS, OVERLAY_MODEL and OVERLAY_CONFIDENCE
      # only change the defaults shown there.
      # Live-view model on the CPU, also used when the GPU can't be: yolo26n.
      # - OVERLAY_CPU_MODEL=yolo26n
    # Intel GPU for OVERLAY_DEVICE=GPU. group_add is the host's `render` group id:
    # `stat -c %g /dev/dri/renderD128`. The server runs as the `node` user (not
    # root); on start it also joins the group of every /dev/dri/render* device.
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add:
    #   - "107"
    volumes:
      # Camera registry, settings, thumbnails and the two databases, kept across updates. A named
      # volume starts with the image's registry; a bind mount such as ./data:/app/data works too
      # (the server copies the default registry into it when it is empty).
      - trafficanalyzer-data:/app/data
    restart: unless-stopped

volumes:
  trafficanalyzer-data:
